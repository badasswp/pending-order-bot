name: PendingOrderBot CI

on:
  push:
    branches-ignore:
      - release-*

permissions:
  contents: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP v8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Validate Composer
        run: |
          composer validate

      - name: Install Composer
        run: |
          composer install --prefer-dist --no-progress

      - name: Run Linting
        run: |
          composer run lint

      - name: Run Testing
        run: |
          composer run test
